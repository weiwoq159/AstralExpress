<!doctype html>
<html lang="zh-CN">
<head>

  <title>应用库 · 缇里西庇俄丝</title>
  <style>
    :root {
      --brand-50:#f1f5fe; --brand-100:#e1eafc; --brand-200:#c3d5f9; --brand-300:#9bb8f3; --brand-400:#6f93ea; --brand-500:#3f6fdc; --brand-600:#2c57bf; --brand-700:#22449a; --brand-900:#12234f;
      --ink-900:#12234f; --ink-700:#3f5380; --ink-500:#5d7199; --ink-300:#b2bdd6; --gold-500:#d4a648;
      --success:#28685b; --success-bg:#d6f1e9; --failed:#8d4d57; --failed-bg:#f9e2e5;
      --glass:rgba(255,255,255,.44); --glass-strong:rgba(255,255,255,.78); --glass-border:rgba(255,255,255,.85);
      --shadow:0 12px 36px rgba(18,35,79,.06),inset 0 1px 0 rgba(255,255,255,.82); --border:rgba(44,87,191,.15);
      color-scheme:light; font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif; color:var(--ink-900);
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 5% 0%,rgba(111,147,234,.24),transparent 38rem),radial-gradient(ellipse at 95% 14%,rgba(150,180,245,.16),transparent 32rem),radial-gradient(ellipse at 60% 100%,rgba(110,200,235,.16),transparent 36rem),linear-gradient(135deg,#eaf1ff,#f6f9ff 48%,#edf2ff); background-attachment:fixed; }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid var(--brand-500); outline-offset:3px; }
    button:disabled { cursor:default; }
    svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .sprite { display:none; }
    .page { max-width:1536px; padding:28px 32px 32px; margin:0 auto; }
    .glass { background:var(--glass); border:1px solid var(--glass-border); border-radius:18px; box-shadow:var(--shadow); backdrop-filter:blur(20px) saturate(125%); -webkit-backdrop-filter:blur(20px) saturate(125%); }
    .hero { position:relative; min-height:164px; overflow:hidden; display:flex; align-items:center; padding:26px 32px; isolation:isolate; background:linear-gradient(110deg,rgba(255,255,255,.76),rgba(225,234,252,.62) 65%,rgba(195,213,249,.55)); }
    .hero-cover { position:absolute; z-index:-2; right:-1px; top:-30%; width:47%; height:165%; object-fit:cover; object-position:42% 40%; opacity:.55; mask-image:linear-gradient(90deg,transparent,#000 28%,#000 77%,transparent),linear-gradient(0deg,transparent,#000 25%,#000 73%,transparent); mask-composite:intersect; -webkit-mask-image:linear-gradient(90deg,transparent,#000 28%,#000 77%,transparent),linear-gradient(0deg,transparent,#000 25%,#000 73%,transparent); -webkit-mask-composite:source-in; }
    .hero::before { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg,rgba(241,245,254,.85),rgba(241,245,254,.74) 42%,transparent 82%); pointer-events:none; }
    .hero::after { content:""; position:absolute; height:3px; width:72px; bottom:0; left:32px; border-radius:3px 3px 0 0; background:linear-gradient(90deg,var(--brand-500),var(--brand-300)); }

    .hero-quote i { color:var(--gold-500); font-style:normal; margin-right:8px; }
    .catalog { margin-top:23px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px; }
    .search { position:relative; display:flex; align-items:center; width:410px; max-width:100%; background:var(--glass-strong); border:1px solid var(--glass-border); border-radius:9px; box-shadow:0 4px 15px rgba(18,35,79,.025); }
    .search svg { margin-left:14px; color:var(--ink-500); width:16px; }

    .search:focus-within { border-color:var(--brand-300); box-shadow:0 0 0 3px rgba(63,111,220,.1); }

    .clear-search svg { margin:0; width:14px; }
    .toolbar-right { display:flex; align-items:center; gap:14px; }

    .availability input { accent-color:var(--brand-500); width:14px; height:14px; margin:0; }
    .sort { padding:9px 27px 9px 11px; border:1px solid var(--glass-border); border-radius:9px; background:var(--glass-strong); font-size:11px; color:var(--ink-700); cursor:pointer; }
    .view-switch { display:flex; padding:3px; border:1px solid var(--glass-border); border-radius:9px; background:var(--glass); gap:3px; }
    .view-switch button { width:31px; height:29px; border:0; border-radius:6px; background:transparent; color:var(--ink-500); display:grid; place-items:center; }
    .view-switch button svg { width:15px; }
    .view-switch button.active { background:white; color:var(--brand-600); box-shadow:0 2px 7px rgba(18,35,79,.08); }
    .categories { display:flex; align-items:center; gap:5px; padding:6px; border:1px solid var(--glass-border); border-radius:12px; background:rgba(255,255,255,.36); overflow-x:auto; scrollbar-width:none; }
    .categories::-webkit-scrollbar { display:none; }
    .category { display:flex; align-items:center; gap:9px; padding:10px 14px; border:0; border-radius:8px; background:transparent; color:var(--ink-700); white-space:nowrap; font-size:11px; }
    .category:hover { background:rgba(255,255,255,.52); }
    .category.active { background:var(--brand-500); color:white; font-weight:700; box-shadow:0 4px 12px rgba(63,111,220,.18); }

    .category.active .count { background:rgba(255,255,255,.2); }
    .collection-heading { display:flex; align-items:center; justify-content:space-between; margin:20px 1px 14px; }
    .collection-title { display:flex; align-items:center; gap:9px; }
    .collection-title::before { content:""; width:3px; height:16px; background:linear-gradient(var(--brand-500),var(--brand-300)); border-radius:4px; }
    .collection-title h2 { font-size:14px; font-weight:700; margin:0; }
    .collection-title span { color:var(--ink-500); font-size:10px; }
    .reset { display:flex; gap:5px; align-items:center; color:var(--brand-600); border:0; background:transparent; font-size:10px; padding:3px 0; }
    .reset svg { width:12px; height:12px; }
    .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; }
    .app-card { position:relative; display:flex; flex-direction:column; min-width:0; min-height:208px; padding:19px 20px 14px; text-align:left; color:inherit; }
    .app-card:hover { background:rgba(255,255,255,.61); border-color:#fff; box-shadow:0 16px 36px rgba(18,35,79,.1),inset 0 1px 0 rgba(255,255,255,.9); transform:translateY(-2px); }
    .app-card.available { background:rgba(255,255,255,.63); }
    .card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:7px; }
    .app-icon { display:grid; place-items:center; width:39px; height:39px; border:1px solid rgba(255,255,255,.9); border-radius:11px; color:var(--brand-600); background:linear-gradient(145deg,#fff,var(--brand-100)); box-shadow:inset 0 1px 0 white; }
    .app-icon svg { width:21px; height:21px; }
    .available .app-icon { color:white; background:linear-gradient(135deg,var(--brand-600),var(--brand-400)); box-shadow:0 5px 12px rgba(44,87,191,.17),inset 0 1px 0 rgba(255,255,255,.32); border-color:transparent; }
    .app-status { display:flex; align-items:center; gap:5px; color:var(--failed); font-size:9px; padding:4px 7px; background:rgba(249,226,229,.53); border-radius:5px; }
    .app-status::before { content:""; width:4px; height:4px; border-radius:50%; background:currentColor; }
    .app-status.available { color:var(--success); background:var(--success-bg); }
    .app-status.disabled { color:#756036; background:#faefcc; }
    .app-name { margin:0 0 6px; font-size:14px; font-weight:700; line-height:1.5; }
    .app-description { margin:0; color:var(--ink-500); font-size:11px; line-height:1.75; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:38px; }
    .app-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:12px; margin-bottom:14px; }
    .app-tags span { padding:3px 6px; border:1px solid rgba(44,87,191,.08); color:var(--ink-500); border-radius:4px; background:rgba(255,255,255,.34); font-size:9px; line-height:1.2; }
    .card-bottom { display:flex; align-items:center; justify-content:space-between; gap:10px; border-top:1px solid rgba(44,87,191,.09); padding-top:11px; margin-top:auto; font-size:9px; color:var(--ink-500); }
    .card-bottom .category-label { display:flex; align-items:center; gap:6px; }
    .card-bottom .category-label i { font-style:normal; color:var(--ink-300); }
    .open-arrow { color:var(--brand-600); display:flex; align-items:center; gap:4px; }
    .open-arrow svg { width:12px; height:12px; }
    .pagination { margin-top:23px; display:flex; justify-content:space-between; align-items:center; gap:12px; color:var(--ink-500); font-size:10px; }
    .page-buttons { display:flex; align-items:center; gap:5px; }
    .page-buttons button { width:29px; height:29px; border:1px solid var(--glass-border); background:rgba(255,255,255,.5); color:var(--ink-700); border-radius:7px; font:11px "Bahnschrift",sans-serif; display:grid; place-items:center; }
    .page-buttons button svg { width:12px; }
    .page-buttons button.active { background:var(--brand-500); border-color:var(--brand-500); color:white; }
    .page-buttons button:disabled { color:var(--ink-300); opacity:.65; }
    .grid.list { grid-template-columns:1fr; gap:10px; }
    .list .app-card { display:grid; grid-template-columns:190px minmax(0,1fr) 180px; column-gap:24px; min-height:unset; padding:16px 20px; align-items:center; }
    .list .card-top { grid-column:1; grid-row:1 / 4; justify-content:flex-start; margin:0; }
    .list .app-name { grid-column:2; margin-bottom:3px; }
    .list .app-description { grid-column:2; min-height:unset; }
    .list .app-tags { grid-column:2; margin:7px 0 0; }
    .list .card-bottom { grid-column:3; grid-row:1 / 4; flex-direction:column; align-items:flex-end; justify-content:center; border:0; margin:0; padding:0; gap:14px; }
    .empty { padding:60px 24px; display:flex; align-items:center; flex-direction:column; text-align:center; }
    .empty-icon { width:54px; height:54px; display:grid; place-items:center; border-radius:16px; background:var(--brand-100); color:var(--brand-500); margin-bottom:14px; }
    .empty h3 { font-size:15px; margin:0 0 8px; }.empty p { color:var(--ink-500); font-size:12px; margin:0 0 18px; }
    .primary { color:white; background:var(--brand-500); border:1px solid var(--brand-500); border-radius:9px; padding:10px 18px; font-size:11px; }
    .primary:hover { background:var(--brand-600); }
    [hidden] { display:none !important; }
    dialog { width:min(520px,calc(100vw - 32px)); padding:0; color:var(--ink-900); border:1px solid white; border-radius:18px; background:#f6f9ff; box-shadow:0 30px 100px rgba(18,35,79,.22); }
    dialog::backdrop { background:rgba(18,35,79,.22); backdrop-filter:blur(5px); }
    .dialog-content { padding:29px; }.dialog-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:19px; }.dialog-top .eyebrow { font-size:9px; }
    .dialog-close { border:0; color:var(--ink-500); background:transparent; padding:5px; display:grid; place-items:center; }
    .dialog-content h2 { font-size:22px; margin:0 0 13px; }.dialog-content p { font-size:12px; line-height:1.9; color:var(--ink-700); margin:0 0 20px; }
    .dialog-fields { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:20px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }.dialog-fields dt { color:var(--ink-500); font-size:10px; margin-bottom:8px; }.dialog-fields dd { font-size:11px; margin:0; overflow-wrap:anywhere; }
    .dialog-footer { display:flex; justify-content:flex-end; margin-top:20px; }
    @media (prefers-reduced-motion:no-preference) { .app-card { transition:transform .18s,box-shadow .18s,background .18s; } }
    @media (max-width:1180px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); }.toolbar-right { gap:9px; }.hero-cover { width:53%; }.hero-quote { display:none; } }
    @media (max-width:900px) { .page { padding:22px; }.grid { grid-template-columns:repeat(2,minmax(0,1fr)); }.toolbar { flex-wrap:wrap; }.search { width:100%; }.toolbar-right { width:100%; justify-content:space-between; }.list .app-card { grid-template-columns:140px minmax(0,1fr); }.list .card-bottom { grid-column:2; grid-row:4; flex-direction:row; align-items:center; justify-content:space-between; margin-top:12px; } }
    @media (max-width:540px) { .page { padding:16px; }.hero { padding:24px; min-height:170px; }.hero::after { left:24px; }.hero h1 { font-size:27px; }.hero p { max-width:230px; }.hero-cover { width:68%; opacity:.3; }.categories { border-radius:10px; }.category { padding:9px 11px; }.grid { grid-template-columns:1fr; gap:12px; }.app-card { min-height:200px; }.collection-title span { font-size:9px; }.list .app-card { display:flex; }.list .card-top { justify-content:space-between; margin-bottom:12px; }.list .app-tags { margin:12px 0 14px; }.list .card-bottom { width:100%; margin-top:0; padding-top:11px; border-top:1px solid var(--border); }.pagination { align-items:flex-start; flex-direction:column; }.dialog-fields { grid-template-columns:1fr; } }
  </style>
</head>

    const categories = { Files:'文件管理', Text:'文本处理', Images:'图片处理', Documents:'文档处理', Dev:'开发辅助', Data:'数据处理' };
    const icons = { Files:'files', Text:'text', Images:'images', Documents:'documents', Dev:'dev', Data:'data' };
    const statuses = { available:'可用', unavailable:'环境缺失', disabled:'已禁用' };
    const state = { category:'all', search:'', availableOnly:false, sort:'order', page:1, view:'grid' };
    const pageSize = 12;
    const $ = id => document.getElementById(id);
    const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const svg = id => `<svg aria-hidden="true"><use href="#${id}"/></svg>`;
    $('totalCount').textContent = manifests.length;
    $('categoryCount').textContent = new Set(manifests.map(m => m.category)).size;
    $('availableCount').textContent = manifests.filter(m => m.status === 'available').length;
    function renderCategories() {
      const entries = [['all','全部应用'], ...Object.entries(categories)];
      $('categories').innerHTML = entries.map(([key,label]) => `<button type="button" class="category ${state.category === key ? 'active' : ''}" data-category="${key}" aria-pressed="${state.category === key}">${label}<span class="count">${key === 'all' ? manifests.length : manifests.filter(m => m.category === key).length}</span></button>`).join('');
    }
    function render() {
      let filtered = manifests.filter(m => (state.category === 'all' || m.category === state.category) && (!state.availableOnly || m.status === 'available') && [m.name,m.description,m.key,...m.tags].join(' ').toLowerCase().includes(state.search.toLowerCase()));
      filtered.sort((a,b) => state.sort === 'name' ? a.name.localeCompare(b.name,'zh-CN') : state.sort === 'status' ? Number(b.status === 'available') - Number(a.status === 'available') || a.order - b.order : a.order - b.order);
      const pages = Math.max(1,Math.ceil(filtered.length/pageSize));
      state.page = Math.min(state.page,pages);
      const offset = (state.page-1)*pageSize;
      const shown = filtered.slice(offset,offset+pageSize);
      $('collectionTitle').textContent = state.category === 'all' ? '全部应用' : categories[state.category];
      $('resultCount').textContent = `共 ${filtered.length} 个`;
      $('resetFilters').hidden = !(state.search || state.category !== 'all' || state.availableOnly || state.sort !== 'order');
      $('clearSearch').hidden = !state.search;
      $('appGrid').classList.toggle('list',state.view === 'list');
      $('appGrid').innerHTML = shown.map(m => `<button type="button" class="app-card glass ${m.status === 'available' ? 'available' : ''}" data-key="${escapeHTML(m.key)}" aria-label="查看${escapeHTML(m.name)}详情"><div class="card-top"><span class="app-icon">${svg(m.key === 'batch-rename' ? 'edit' : icons[m.category] || 'files')}</span><span class="app-status ${m.status}">${statuses[m.status] || m.status}</span></div><h3 class="app-name">${escapeHTML(m.name)}</h3><p class="app-description">${escapeHTML(m.description)}</p><div class="app-tags">${m.tags.slice(0,3).map(tag => `<span>${escapeHTML(tag)}</span>`).join('')}</div><div class="card-bottom"><span class="category-label">${categories[m.category] || escapeHTML(m.category)}<i>·</i>${m.isQueue ? '队列任务' : '即时运行'}</span><span class="open-arrow">详情 ${svg('arrow')}</span></div></button>`).join('');
      $('emptyState').hidden = filtered.length > 0;
      $('pagination').hidden = filtered.length === 0;
      $('pageInfo').textContent = `显示 ${offset+1}–${Math.min(offset+pageSize,filtered.length)} 项，共 ${filtered.length} 个应用`;
      $('pageButtons').innerHTML = `<button type="button" data-page="${state.page-1}" aria-label="上一页" ${state.page === 1 ? 'disabled' : ''}>${svg('left')}</button>` + Array.from({length:pages},(_,i) => `<button type="button" data-page="${i+1}" class="${state.page === i+1 ? 'active' : ''}" ${state.page === i+1 ? 'aria-current="page"' : ''}>${i+1}</button>`).join('') + `<button type="button" data-page="${state.page+1}" aria-label="下一页" ${state.page === pages ? 'disabled' : ''}>${svg('right')}</button>`;
      renderCategories();
    }
    function reset() { Object.assign(state,{category:'all',search:'',availableOnly:false,sort:'order',page:1}); $('searchInput').value=''; $('availableOnly').checked=false; $('sortSelect').value='order'; render(); }
    $('searchInput').addEventListener('input',e => { state.search=e.target.value.trim();state.page=1;render(); });
    $('clearSearch').addEventListener('click',() => { $('searchInput').value='';state.search='';state.page=1;render();$('searchInput').focus(); });
    $('availableOnly').addEventListener('change',e => { state.availableOnly=e.target.checked;state.page=1;render(); });
    $('sortSelect').addEventListener('change',e => { state.sort=e.target.value;state.page=1;render(); });
    $('categories').addEventListener('click',e => { const button=e.target.closest('[data-category]');if(button){state.category=button.dataset.category;state.page=1;render();} });
    $('resetFilters').addEventListener('click',reset);$('emptyReset').addEventListener('click',reset);
    $('pageButtons').addEventListener('click',e => { const button=e.target.closest('[data-page]');if(button && !button.disabled){state.page=Number(button.dataset.page);render();$('collectionTitle').scrollIntoView({behavior:'auto',block:'start'});} });
    ['grid','list'].forEach(view => $(view+'View').addEventListener('click',() => {state.view=view;['grid','list'].forEach(v => {$(v+'View').classList.toggle('active',v===view);$(v+'View').setAttribute('aria-pressed',String(v===view));});render();}));
    $('appGrid').addEventListener('click',e => { const card=e.target.closest('[data-key]');if(!card)return;const m=manifests.find(m=>m.key===card.dataset.key);$('dialogTitle').textContent=m.name;$('dialogDescription').textContent=m.description;$('dialogKey').textContent=m.key;$('dialogCategory').textContent=categories[m.category]||m.category;$('dialogStatus').textContent=statuses[m.status];$('dialogMode').textContent=m.isQueue?'加入任务队列':'直接执行';$('detailDialog').showModal(); });
    $('closeDialog').addEventListener('click',()=>$('detailDialog').close());$('dialogConfirm').addEventListener('click',()=>$('detailDialog').close());
    $('detailDialog').addEventListener('click',e=>{if(e.target===$('detailDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
    render();
  </script>
